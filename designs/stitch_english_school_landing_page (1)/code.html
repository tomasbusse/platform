<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Let's Connect</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0A192F", // Deep navy blue
                        "accent": "#D4AF37", // Gold/brass
                        "background-light": "#F5F5F7", // Off-white/light grey for popup
                        "background-dark": "#101622", // A dark bg for the theme
                        "text-light": "#333333", // Dark charcoal grey
                        "text-dark": "#E0E0E0"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    keyframes: {
                        assemble1: {
                          '0%': { transform: 'translate(30vw, -35vh) rotate(120deg) scale(0.7)', opacity: 0 },
                          '15%': { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                          '85%': { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                          '100%': { transform: 'translate(-20vw, 40vh) rotate(-100deg) scale(0.7)', opacity: 0 }
                        },
                        assemble2: {
                          '0%': { transform: 'translate(-25vw, -40vh) rotate(-80deg) scale(0.7)', opacity: 0 },
                          '15%': { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                          '85%': { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                          '100%': { transform: 'translate(30vw, 30vh) rotate(90deg) scale(0.7)', opacity: 0 }
                        },
                        assemble3: {
                          '0%': { transform: 'translate(10vw, -50vh) rotate(150deg) scale(0.7)', opacity: 0 },
                          '15%': { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                          '85%': { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                          '100%': { transform: 'translate(25vw, -30vh) rotate(-120deg) scale(0.7)', opacity: 0 }
                        },
                        assemble4: {
                          '0%': { transform: 'translate(-15vw, -45vh) rotate(-180deg) scale(0.7)', opacity: 0 },
                          '15%': { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                          '85%': { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
                          '100%': { transform: 'translate(-30vw, 35vh) rotate(150deg) scale(0.7)', opacity: 0 }
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 }
                        }
                    },
                    animation: {
                        'assemble-1': 'assemble1 12s ease-in-out infinite',
                        'assemble-2': 'assemble2 12s ease-in-out infinite',
                        'assemble-3': 'assemble3 12s ease-in-out infinite',
                        'assemble-4': 'assemble4 12s ease-in-out infinite',
                        'fade-in': 'fadeIn 1s ease-in-out forwards',
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
        }
        #tab-call:checked~#content-call,
        #tab-chat:checked~#content-chat {
            display: flex
        }
        #tab-call:checked~#content-chat,
        #tab-chat:checked~#content-call {
            display: none
        }
        .lego-piece {
            background-color: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #0A192F;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
        }
        .lego-piece::before, .lego-piece::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            top: -4.5px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
        }
        .w-24 .lego-piece::before { left: 10px; }
        .w-24 .lego-piece::after { right: 10px; }
        .w-20 .lego-piece::before { left: calc(50% - 4px); }
        .w-20 .lego-piece::after { content: none; }
        .w-28 .lego-piece::before { left: 15px; }
        .w-28 .lego-piece::after { right: 15px; }
        .w-32 .lego-piece::before { left: 20px; }
        .w-32 .lego-piece::after { right: 20px; }
        .w-16 .lego-piece::before { left: calc(50% - 4px); }
        .w-16 .lego-piece::after { content: none; }
    </style>
</head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col bg-gray-200 overflow-hidden">
<div class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm"></div>
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
<div class="relative flex aspect-square w-full max-w-[600px] flex-col overflow-hidden rounded-full bg-background-light shadow-2xl">
<div class="absolute inset-0 h-full w-full overflow-hidden">
<div class="absolute inset-0 flex flex-col items-center justify-center space-y-8">
<div class="relative h-10 w-full max-w-sm" style="animation-delay: 0s;">
<div class="lego-piece h-10 w-24 rounded-lg animate-assemble-1" style="left: 0; animation-delay: -0.1s;">Speak</div>
<div class="lego-piece h-10 w-28 rounded-lg animate-assemble-2" style="left: 100px; animation-delay: 0s;">English</div>
<div class="lego-piece h-10 w-24 rounded-lg animate-assemble-3" style="left: 216px; animation-delay: 0.1s;">Fluently</div>
</div>
<div class="relative h-10 w-full max-w-sm" style="animation-delay: -4s;">
<div class="lego-piece h-10 w-28 rounded-lg animate-assemble-1" style="left: 0; animation-delay: -0.2s;">Communicate</div>
<div class="lego-piece h-10 w-16 rounded-lg animate-assemble-2" style="left: 116px; animation-delay: -0.1s;">with</div>
<div class="lego-piece h-10 w-20 rounded-lg animate-assemble-3" style="left: 184px; animation-delay: 0s;">the</div>
<div class="lego-piece h-10 w-20 rounded-lg animate-assemble-4" style="left: 268px; animation-delay: 0.1s;">World</div>
</div>
<div class="relative h-10 w-full max-w-sm" style="animation-delay: -8s;">
<div class="lego-piece h-10 w-24 rounded-lg animate-assemble-1" style="left: 0px; animation-delay: -0.1s;">Unlock</div>
<div class="lego-piece h-10 w-20 rounded-lg animate-assemble-2" style="left: 100px; animation-delay: 0s;">your</div>
<div class="lego-piece h-10 w-32 rounded-lg animate-assemble-3" style="left: 184px; animation-delay: 0.1s;">Potential</div>
</div>
</div>
</div>
<button aria-label="Close modal" class="absolute right-12 top-12 z-20 text-text-light/50 hover:text-text-light">
<span class="material-symbols-outlined">close</span>
</button>
<div class="absolute inset-0 bg-background-light/85 backdrop-blur-[10px]"></div>
<div class="relative z-10 flex h-full w-full flex-col items-center justify-center px-16">
<h1 class="text-text-light tracking-light text-[32px] font-bold leading-tight pt-6 text-center flex items-center gap-3">
<svg class="h-8 w-8 text-accent" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"></path>
<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"></path>
</svg>
                        Let's Connect
                    </h1>
<input checked="" class="hidden" id="tab-call" name="contact-tabs" type="radio"/>
<input class="hidden" id="tab-chat" name="contact-tabs" type="radio"/>
<div class="flex w-full max-w-sm justify-center py-6">
<div class="flex h-10 w-full items-center justify-center rounded-full bg-gray-200 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-full px-2 text-sm font-medium leading-normal text-gray-500 has-[:checked]:bg-background-light has-[:checked]:text-primary has-[:checked]:shadow-md" for="tab-call">
                                SCHEDULE A CALL
                            </label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-full px-2 text-sm font-medium leading-normal text-gray-500 has-[:checked]:bg-background-light has-[:checked]:text-primary has-[:checked]:shadow-md" for="tab-chat">
                                CHAT WITH US
                            </label>
</div>
</div>
<div class="flex w-full max-w-sm flex-col items-center" id="content-call">
<p class="text-text-light/80 text-base font-normal leading-normal pb-4 text-center">Leave your details and our academic advisor will contact you shortly.</p>
<div class="w-full space-y-4">
<div class="flex w-full flex-wrap items-end gap-4">
<label class="flex w-full flex-col">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl border border-gray-300 bg-background-light px-4 py-3 text-base font-normal leading-normal text-text-light placeholder:text-gray-400 focus:border-accent focus:outline-0 focus:ring-1 focus:ring-accent" placeholder="Name" type="text" value=""/>
</label>
</div>
<div class="flex w-full flex-wrap items-end gap-4">
<label class="flex w-full flex-col">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl border border-gray-300 bg-background-light px-4 py-3 text-base font-normal leading-normal text-text-light placeholder:text-gray-400 focus:border-accent focus:outline-0 focus:ring-1 focus:ring-accent" placeholder="Email" type="email" value=""/>
</label>
</div>
<div class="flex w-full flex-wrap items-end gap-4">
<label class="flex w-full flex-col">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl border border-gray-300 bg-background-light px-4 py-3 text-base font-normal leading-normal text-text-light placeholder:text-gray-400 focus:border-accent focus:outline-0 focus:ring-1 focus:ring-accent" placeholder="Phone" type="tel" value=""/>
</label>
</div>
</div>
<button class="mt-6 flex h-12 w-full items-center justify-center rounded-full bg-primary px-6 text-base font-medium text-white shadow-lg transition-colors hover:bg-primary/90">
                            SEND REQUEST
                        </button>
</div>
<div class="hidden w-full max-w-sm flex-col items-center" id="content-chat">
<div class="flex w-full flex-1 flex-col rounded-lg">
<div class="flex items-center gap-3 pb-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary text-accent">
<svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1h-2v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"></path>
</svg>
</div>
<div>
<p class="font-medium text-text-light">English School Support</p>
<div class="flex items-center gap-1.5">
<div class="h-2 w-2 rounded-full bg-green-500"></div>
<p class="text-sm text-text-light/70">Our team is online</p>
</div>
</div>
</div>
<div class="flex-1 space-y-3 overflow-y-auto pr-2">
<div class="flex w-full max-w-[80%]">
<div class="rounded-lg rounded-bl-none bg-gray-200 p-3">
<p class="text-sm text-text-light">Welcome! Have a question about our courses?</p>
</div>
</div>
</div>
<div class="relative mt-4 flex items-center">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-full border border-gray-300 bg-background-light py-3 pl-4 pr-12 text-sm font-normal leading-normal text-text-light placeholder:text-gray-400 focus:border-accent focus:outline-0 focus:ring-1 focus:ring-accent" placeholder="Type your message..." type="text" value=""/>
<button aria-label="Send message" class="absolute right-2 flex h-8 w-8 items-center justify-center rounded-full bg-primary text-white transition-colors hover:bg-primary/90">
<span class="material-symbols-outlined text-base">send</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>

</body></html>
