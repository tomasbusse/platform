<script id="tailwind-config">

            darkMode: "class",

                extend: {
                    colors: {
                        "primary": "#0A192F", // Deep navy blue
                        "accent": "#D4AF37", // Gold/brass

                        "text-light": "#333333", // Dark charcoal grey

                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 }

                    animation: {

                        'float-medium': 'float 10s ease-in-out infinite',

                        'fade-in': 'fadeIn 1s ease-in-out forwards',

        }
