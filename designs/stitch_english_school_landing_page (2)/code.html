<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>English School Landing Page</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#ff5722",
            "background-light": "#f8f9fa",
            "background-dark": "#121212",
          },
          fontFamily: {
            display: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "1rem",
          },
        },
      },
    };
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 300,
      'GRAD' 0,
      'opsz' 24
    }
    .talk-button {
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .talk-button:hover {
      transform: scale(1.03);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .card {
       transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200 antialiased">
<div class="min-h-screen flex flex-col p-4 sm:p-6 lg:p-8">
<header class="w-full max-w-7xl mx-auto mb-16">
<nav class="flex justify-between items-center py-4">
<a class="flex items-center space-x-3 group" href="#">
<div class="w-10 h-10 bg-gray-900 dark:bg-white rounded-full flex items-center justify-center transition-transform group-hover:rotate-12">
<span class="material-symbols-outlined text-white dark:text-gray-900">
              translate
            </span>
</div>
<span class="text-xl font-bold text-gray-900 dark:text-white">Simulards</span>
</a>
<div class="flex items-center space-x-4">
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
<span class="font-bold text-lg text-gray-900 dark:text-white">J</span>
</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined text-gray-900 dark:text-white">
              menu
            </span>
</button>
</div>
</nav>
</header>
<main class="flex-grow flex items-center justify-center">
<div class="w-full max-w-7xl mx-auto">
<div class="grid grid-cols-1 lg:grid-cols-4 gap-8 xl:gap-12 items-center">
<div class="lg:col-span-1 flex justify-center lg:justify-end">
<div class="card bg-white dark:bg-gray-800 rounded-full w-48 h-48 sm:w-56 sm:h-56 lg:w-64 lg:h-64 flex flex-col items-center justify-center text-center p-6 border border-gray-200 dark:border-gray-700 shadow-sm cursor-pointer" style="background-color: #e0f2fe; dark:background-color: #0c4a6e;">
<div class="bg-sky-500/20 dark:bg-sky-400/20 p-4 rounded-full mb-4">
<span class="material-symbols-outlined text-3xl sm:text-4xl text-sky-800 dark:text-sky-300">
                  quiz
                </span>
</div>
<h2 class="text-xl sm:text-2xl font-bold text-sky-900 dark:text-sky-200">Test</h2>
<p class="text-sm sm:text-base text-sky-700 dark:text-sky-300 mt-1">Check your level</p>
</div>
</div>
<div class="lg:col-span-2 flex justify-center order-first lg:order-none">
<button class="talk-button bg-primary rounded-full w-64 h-64 sm:w-80 sm:h-80 lg:w-96 lg:h-96 flex items-center justify-center text-white text-7xl sm:text-8xl lg:text-9xl font-black tracking-tighter shadow-lg">
              TALK
            </button>
</div>
<div class="lg:col-span-1 flex justify-center lg:justify-start">
<div class="card bg-white dark:bg-gray-800 rounded-full w-48 h-48 sm:w-56 sm:h-56 lg:w-64 lg:h-64 flex flex-col items-center justify-center text-center p-6 border border-gray-200 dark:border-gray-700 shadow-sm cursor-pointer" style="background-color: #e0fbf4; dark:background-color: #042f2e;">
<div class="bg-emerald-500/20 dark:bg-emerald-400/20 p-4 rounded-full mb-4">
<span class="material-symbols-outlined text-3xl sm:text-4xl text-emerald-800 dark:text-emerald-300">
                  local_offer
                </span>
</div>
<h2 class="text-xl sm:text-2xl font-bold text-emerald-900 dark:text-emerald-200">Offer</h2>
<p class="text-sm sm:text-base text-emerald-700 dark:text-emerald-300 mt-1">View our courses</p>
</div>
</div>
</div>
</div>
</main>
</div>

</body></html>
